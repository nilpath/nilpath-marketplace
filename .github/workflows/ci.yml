name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Check Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: sh trusted/tools/pr_conventions.sh --title "$PR_TITLE"
      - uses: actions/setup-python@v7.1.0
        if: startsWith(github.head_ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.3
        if: startsWith(github.head_ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository
        with:
          version: "0.12.23"
          python-version: "3.11"
      - name: Check exact prepared release with trusted base tools
        id: release-check
        if: startsWith(github.head_ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: trusted
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          make install VENV="$RUNNER_TEMP/nilpath-check"
          git fetch --no-tags ../candidate "$HEAD_SHA"
          export PATH="$RUNNER_TEMP/nilpath-check/bin:$PATH"
          "$RUNNER_TEMP/nilpath-check/bin/python" tools/prepare_release.py \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --head-ref "$HEAD_REF" --check
      - name: Check generated files
        working-directory: candidate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXACT_RELEASE: ${{ steps.release-check.outcome == 'success' }}
        run: |
          if [ "$EXACT_RELEASE" = true ]; then
            echo "Exact selected-plugin release output was validated with trusted base tools."
          else
            sh tools/check_generated.sh "$BASE_SHA"
          fi

  test-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.23"
          python-version: "3.11"
      - run: make install VENV="$RUNNER_TEMP/nilpath-ci"
      - name: Test a fresh temporary render
        run: make test-static VENV="$RUNNER_TEMP/nilpath-ci"
