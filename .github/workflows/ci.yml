name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: tools/pr_conventions.sh --title "$PR_TITLE"
      - name: Check generated-file ownership
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -S tools/check_generated.py --base-sha "$BASE_SHA"

  test-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.23"
          python-version: "3.11"
      - run: make install VENV="$RUNNER_TEMP/nilpath-ci"
      - name: Test a fresh temporary render
        run: make test-static VENV="$RUNNER_TEMP/nilpath-ci"

  release-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.23"
          python-version: "3.11"
      - run: |
          make install VENV="$RUNNER_TEMP/nilpath-ci"
          echo "$RUNNER_TEMP/nilpath-ci/bin" >> "$GITHUB_PATH"
      - name: Check release history and exact proposal boundary
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            "$RUNNER_TEMP/nilpath-ci/bin/python" tools/release.py check-pr --base-sha "$BASE_SHA"
          else
            "$RUNNER_TEMP/nilpath-ci/bin/python" tools/release.py check
          fi
