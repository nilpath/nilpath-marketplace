name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Prepare a proposal or retry a reviewed merged proposal's drafts.
        type: choice
        options: [prepare, drafts]
        default: prepare
        required: true
      proposal_pr:
        description: Proposal PR number for resolution or draft retry.
        type: string
      expected_head:
        description: Full edited proposal head SHA for resolution.
        type: string
      merged_sha:
        description: Exact reviewed merge SHA for draft retry.
        type: string

permissions:
  contents: read

concurrency:
  group: component-release-main
  cancel-in-progress: false

env:
  DISPATCHER_SHA: ${{ github.workflow_sha }}
  RELEASE_MODE: ${{ inputs.mode || 'auto' }}
  PROPOSAL_PR: ${{ inputs.proposal_pr }}
  EXPECTED_HEAD: ${{ inputs.expected_head }}
  MERGED_SHA: ${{ inputs.merged_sha }}

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: dispatcher
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Resolve immutable input and resolution identity
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -S dispatcher/tools/release.py snapshot --output "$RUNNER_TEMP/request.json"
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.snapshot.outputs.input_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.23"
          python-version: "3.11"
      - name: Install declared local dependencies
        if: steps.snapshot.outputs.kind == 'proposal'
        working-directory: candidate
        run: |
          make install VENV="$RUNNER_TEMP/nilpath-release"
          echo "$RUNNER_TEMP/nilpath-release/bin" >> "$GITHUB_PATH"
      - name: Check input before source updates
        if: steps.snapshot.outputs.kind == 'proposal'
        working-directory: candidate
        run: make test-static VENV="$RUNNER_TEMP/nilpath-release"
      - name: Prepare versions and generated transaction
        if: steps.snapshot.outputs.kind == 'proposal'
        working-directory: candidate
        run: '"$RUNNER_TEMP/nilpath-release/bin/python" tools/release.py prepare --request "$RUNNER_TEMP/request.json"'
      - name: Test prepared source preview
        if: steps.snapshot.outputs.kind == 'proposal'
        working-directory: candidate
        run: make test-static VENV="$RUNNER_TEMP/nilpath-release"
      - name: Export data only
        if: steps.snapshot.outputs.kind == 'proposal'
        working-directory: candidate
        run: '"$RUNNER_TEMP/nilpath-release/bin/python" tools/release.py bundle --request "$RUNNER_TEMP/request.json" --output "$RUNNER_TEMP/release-bundle/proposal.json"'
      - name: Export recorded merge without executing historical code
        if: steps.snapshot.outputs.kind == 'drafts'
        run: |
          python -S dispatcher/tools/release.py bundle --root candidate \
            --request "$RUNNER_TEMP/request.json" \
            --output "$RUNNER_TEMP/release-bundle/proposal.json"
      - uses: actions/upload-artifact@v7.0.2
        id: upload
        with:
          name: release-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-bundle/proposal.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7

  verify:
    needs: inspect
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: dispatcher
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Independently resolve immutable input
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -S dispatcher/tools/release.py snapshot --output "$RUNNER_TEMP/request.json"
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.snapshot.outputs.input_sha }}
          path: input
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.23"
          python-version: "3.11"
      - name: Install dispatcher-owned renderer dependencies
        working-directory: dispatcher
        run: |
          make install VENV="$RUNNER_TEMP/nilpath-verifier"
          echo "$RUNNER_TEMP/nilpath-verifier/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.inspect.outputs.artifact_id }}
          path: ${{ runner.temp }}/release-bundle
          merge-multiple: true
      - name: Independently reconstruct and compare the complete transaction
        run: |
          "$RUNNER_TEMP/nilpath-verifier/bin/python" dispatcher/tools/release.py verify-bundle \
            --root input --request "$RUNNER_TEMP/request.json" \
            --artifact "$RUNNER_TEMP/release-bundle/proposal.json" \
            --output "$RUNNER_TEMP/release-verified/verified.json"
      - uses: actions/upload-artifact@v7.0.2
        id: upload
        with:
          name: release-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-verified/verified.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7

  write:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: dispatcher
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: ${{ runner.temp }}/release-verified
          merge-multiple: true
      - name: Validate data and reconcile GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFICATION_ARTIFACT_ID: ${{ needs.verify.outputs.artifact_id }}
        run: |
          python -S dispatcher/tools/release.py write \
            --artifact "$RUNNER_TEMP/release-verified/verified.json" \
            --verification-artifact-id "$VERIFICATION_ARTIFACT_ID"
