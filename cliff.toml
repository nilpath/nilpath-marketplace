[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/nilpath/nilpath-marketplace/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
filter_commits = false
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat(\\(|!?:)", group = "Added" },
  { message = "^fix(\\(|!?:)", group = "Fixed" },
  { message = "^(docs|perf|refactor)(\\(|!?:)", group = "Changed" },
  { message = ".*", group = "Other" },
]
