[project]
name = "nilpath-marketplace-tests"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "behavioral: tests that invoke Claude CLI (require API access and incur cost)",
]
