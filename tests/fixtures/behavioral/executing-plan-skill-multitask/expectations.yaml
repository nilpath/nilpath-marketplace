# The executing-plan skill must run each task atomically: a python-task-agent
# call followed by a code-reviewer call, repeated three times. The orchestrator
# must also Edit plan.md to flip task checkboxes as work proceeds. A final
# holistic code-reviewer call is expected after the last task.
# Note: The initial skill invocation via /slash-command does not produce a
# Skill tool call in the stream — only sub-skill calls within the skill do.

required_invocations:
  - type: Agent
    subagent_type: "claude-code-tools:implementation:python-task-agent"
  - type: Agent
    subagent_type: "claude-code-tools:review:code-reviewer"
  - type: Edit

expected_sequence:
  # Task 001
  - type: Agent
    subagent_type: "claude-code-tools:implementation:python-task-agent"
  - type: Agent
    subagent_type: "claude-code-tools:review:code-reviewer"
  # Task 002 — must NOT be bundled with Task 001
  - type: Agent
    subagent_type: "claude-code-tools:implementation:python-task-agent"
  - type: Agent
    subagent_type: "claude-code-tools:review:code-reviewer"
  # Task 003 — must NOT be bundled with Task 002
  - type: Agent
    subagent_type: "claude-code-tools:implementation:python-task-agent"
  - type: Agent
    subagent_type: "claude-code-tools:review:code-reviewer"
  # Final holistic review after all tasks
  - type: Agent
    subagent_type: "claude-code-tools:review:code-reviewer"
