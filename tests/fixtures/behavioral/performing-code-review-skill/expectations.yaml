# The performing-code-review skill must delegate to the code-reviewer agent.
# Note: The initial skill invocation via /slash-command does not produce a
# Skill tool call in the stream — only sub-skill calls within the skill do.

required_invocations:
  - type: Agent
    subagent_type: "claude-code-tools:review:code-reviewer"

expected_sequence:
  - type: Agent
    subagent_type: "claude-code-tools:review:code-reviewer"
