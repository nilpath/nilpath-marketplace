# The planning skill must delegate to task-decomposer and plan-reviewer.
# Note: The initial skill invocation via /slash-command does not produce a
# Skill tool call in the stream — only sub-skill calls within the skill do.

required_invocations:
  - type: Agent
    subagent_type: "engineering-workflow:planning:task-decomposer"
  - type: Agent
    subagent_type: "engineering-workflow:review:plan-reviewer"

expected_sequence:
  - type: Agent
    subagent_type: "engineering-workflow:planning:task-decomposer"
  - type: Agent
    subagent_type: "engineering-workflow:review:plan-reviewer"
