# The writing-documentation skill must delegate writing to doc-writer then audit with doc-auditor.
# The expected_sequence enforces that doc-writer runs before doc-auditor (audit-after-write mandate).

required_invocations:
  - type: Agent
    subagent_type: "claude-code-tools:implementation:doc-writer"
  - type: Agent
    subagent_type: "claude-code-tools:review:doc-auditor"

expected_sequence:
  - type: Agent
    subagent_type: "claude-code-tools:implementation:doc-writer"
  - type: Agent
    subagent_type: "claude-code-tools:review:doc-auditor"
