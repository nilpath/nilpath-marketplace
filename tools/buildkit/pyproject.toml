[project]
name = "nilpath-buildkit"
version = "0.1.0"
description = "Build CLI that renders nilpath-marketplace sources into per-harness outputs (Claude Code, GitHub Copilot, Codex)"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.scripts]
nilpath-build = "buildkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buildkit"]
